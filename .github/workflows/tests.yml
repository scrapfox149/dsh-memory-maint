name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest        # 脚本按 Windows 习惯写（路径分隔符、tasklist 等）
    env:
      # CI 的 checkout 目录里既没有 .dsh-meow/ 也没有 AGENTS.md，
      # 所以 paths.workspace_root() 会按设计报错（不猜路径）。
      # 显式告诉它工作区在哪——这也顺便验证了环境变量这条路是通的。
      DSH_MEMORY_WORKSPACE: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ① 纯函数数值（不碰库）
      - name: 单元测试（decay / text）
        run: python tests/test-units.py

      # ② 冒烟：每个脚本都能跑起来、不抛 Traceback
      #    用空库——CI 上没有真实记忆库，也不该有
      #
      #    注意：造库用**独立脚本**而不是内联块。
      #    2026-11-24 第一版写在 `shell: python` 里，heredoc 处理方式和 bash 不同，
      #    CI 上直接 failure；落成 test-make-db.py 后两边都能跑。
      - name: 造一个空库
        run: python tests/test-make-db.py tmp/ci.db

      - name: 冒烟测试（空库）
        run: python tests/test-mem-plugin.py --db tmp/ci.db
