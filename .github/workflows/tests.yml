name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest        # 脚本按 Windows 习惯写（路径分隔符、tasklist 等）
    env:
      # CI 的 checkout 目录里既没有 .dsh-meow/ 也没有 AGENTS.md，
      # 所以 paths.workspace_root() 会按设计报错（不猜路径）。
      # 显式告诉它工作区在哪——这也顺便验证了环境变量这条路是通的。
      DSH_MEMORY_WORKSPACE: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # ① 纯函数数值（不碰库）
      - name: 单元测试（decay / text）
        run: python tests/test-units.py

      # ② 冒烟：每个脚本都能跑起来、不抛 Traceback
      #    用空库——CI 上没有真实记忆库，也不该有
      #
      #    注意：造库用**独立脚本**而不是内联块。
      #    2026-11-24 第一版写在 `shell: python` 里，heredoc 处理方式和 bash 不同，
      #    CI 上直接 failure；落成 test-make-db.py 后两边都能跑。
      - name: 造一个空库
        run: python tests/test-make-db.py tmp/ci.db

      - name: 冒烟测试（空库）
        run: python tests/test-mem-plugin.py --db tmp/ci.db

      # ⑤ 新功能的边界（agent.name / backup.targets / audit --all / args 转发 / help 摘要）
      - name: 新功能边界
        run: python tests/test-newfeat.py

      # ⑥ 工具开关即时生效（2026-11-25 #16）：改 config.json 不重启就摘/挂工具
      - name: 工具开关即时生效
        run: node tests/switch-test.mjs

      # ⑥ 全量：15 组极端场景（42 断言）——包含 10 万条、损坏库、并发、只读等
      #    慢（几分钟），但这是「发版前必跑」的那一个，CI 上也不能省
      - name: 全量测试（极端场景）
        run: python tests/test-full.py
        timeout-minutes: 20
